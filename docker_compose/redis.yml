services:
  cache_links_redis:
    image: redis:latest
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASS}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASS}
    ports:
      - 6379:6379
    volumes:
      - ../config/redis.conf:/usr/local/etc/redis/redis.conf